apply plugin: "com.android.library"

group = "com.homeapp.notificationexpenseimport"
version = "1.0.0"

def expoModulesCorePlugin = new File(
  project(":expo-modules-core").projectDir.absolutePath,
  "ExpoModulesCorePlugin.gradle"
)
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
apply plugin: "kotlin-kapt"
useCoreDependencies()
useDefaultAndroidSdkVersions()
useExpoPublishing()

android {
  namespace "com.homeapp.notificationexpenseimport"

  defaultConfig {
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    versionCode 1
    versionName "1.0.0"
  }

  compileOptions {
    coreLibraryDesugaringEnabled true
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  buildFeatures {
    buildConfig true
  }

  testOptions {
    unitTests.includeAndroidResources = true
  }

  sourceSets {
    androidTest.assets.srcDirs += files("$projectDir/schemas")
  }
}

kapt {
  arguments {
    arg("room.schemaLocation", file("$projectDir/schemas").path)
  }
}

dependencies {
  coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
  implementation "androidx.room:room-runtime:2.6.1"
  implementation "androidx.work:work-runtime-ktx:2.9.1"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
  kapt "androidx.room:room-compiler:2.6.1"

  testImplementation "junit:junit:4.13.2"
  testImplementation "org.json:json:20240303"
  androidTestImplementation "androidx.room:room-testing:2.6.1"
  androidTestImplementation "androidx.test:core:1.6.1"
  androidTestImplementation "androidx.test.ext:junit:1.2.1"
  androidTestImplementation "androidx.test:runner:1.6.2"
}
